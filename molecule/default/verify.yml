---
- name: Verify
  hosts: all
  tasks:
    - name: Check config
      ansible.builtin.command: chronyd -p -f /etc/chrony/chrony.conf
      changed_when: false

    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Check chrony is enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['chrony.service'].status == 'enabled'
          - ansible_facts.services['chrony.service'].state == 'running'

    - name: Check chronyc to chronyd
      ansible.builtin.command: chronyc -n sources
      changed_when: false
...
