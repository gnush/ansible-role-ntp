---
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - debian12
          - debian13
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: pip install ansible-core molecule molecule-plugins[docker]

      # host's chronyd AppArmor profile also confines the container's chronyd by path
      - name: Unload host chronyd AppArmor profile
        run: sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.chronyd || true

      - name: Molecule
        run: molecule test --platform-name ${{ matrix.platform }} --destroy never
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Chrony logs
        if: failure()
        run: |
          docker exec ${{ matrix.platform }} systemctl status chrony --no-pager || true
          docker exec ${{ matrix.platform }} journalctl -xeu chrony --no-pager || true
          sudo dmesg | grep -i 'apparmor="DENIED"' | tail -20 || true
...
