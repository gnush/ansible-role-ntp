---
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - debian12
          - debian13
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: pip install ansible-core molecule molecule-plugins[docker]

      - name: Molecule
        run: molecule test --platform-name ${{ matrix.platform }} --destroy never
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Chrony logs
        if: failure()
        run: |
          docker exec ${{ matrix.platform }} systemctl status chrony --no-pager || true
          docker exec ${{ matrix.platform }} journalctl -xeu chrony --no-pager || true
          docker exec ${{ matrix.platform }} systemctl cat chrony --no-pager || true
          docker exec ${{ matrix.platform }} sh -c 'echo DAEMON_OPTS=\"-F 0\" > /etc/default/chrony && systemctl restart chrony && systemctl is-active chrony' || true
          docker exec ${{ matrix.platform }} journalctl -u chrony -n 15 --no-pager || true
          docker exec ${{ matrix.platform }} sh -c 'grep chrony /sys/kernel/security/apparmor/profiles' || true
          sudo dmesg | grep -i 'apparmor="DENIED"' | tail -20 || true
...
