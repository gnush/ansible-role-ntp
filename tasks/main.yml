---
# setup #
- name: Install chrony
  ansible.builtin.package:
    name: "chrony"
    state: present

- name: Populate package facts
  ansible.builtin.package_facts:

- name: Populate service facts
  ansible.builtin.service_facts:

- name: Disable conflicting services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ntp
    - ntpd
    - ntpsec
    - openntpd
    - systemd-timesyncd
  when: >-
    (ansible_facts.services[item ~ '.service'] | default({})).status | default('not-found') != 'not-found'

- name: Start chrony service
  ansible.builtin.service:
    name: "{{ ntp_service_name }}"
    state: started
    enabled: true

# config #
- name: Create chrony config dir
  ansible.builtin.file:
    path: "{{ ntp_config_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Set up chrony config
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ ntp_config_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart ntp service


## conf.d ##
- name: Create chrony drop in config dir
  ansible.builtin.file:
    path: "{{ ntp_conf_d_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Set up chrony allow.conf
  ansible.builtin.template:
    src: allow.conf.j2
    dest: "{{ ntp_conf_d_dir }}/allow.conf"
    owner: root
    group: root
    mode: '0644'
    backup: true
  when: ntp_allow_client_cidrs | length > 0
  notify: Restart ntp service

- name: Remove chrony allow.conf
  ansible.builtin.file:
    path: "{{ ntp_conf_d_dir }}/allow.conf"
    state: absent
  when: ntp_allow_client_cidrs | length == 0
  notify: Restart ntp service


## sources.d ##
- name: Create chrony sources dir
  ansible.builtin.file:
    path: "{{ ntp_sources_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Set up chrony sources
  ansible.builtin.template:
    src: ntp.sources.j2
    dest: "{{ ntp_sources_dir }}/ntp.sources"
    owner: root
    group: root
    mode: '0644'
    backup: true
  when: ntp_sources | length > 0
  notify: Restart ntp service

- name: Remove chrony sources
  ansible.builtin.file:
    path: "{{ ntp_sources_dir }}/ntp.sources"
    state: absent
  when: ntp_sources | length == 0
  notify: Restart ntp service
...
